[package]
name = "sbpf2rv"
version = "0.1.0"
edition = "2021"
description = "Translates an sBPF ELF into C that runs natively in the Rand zkVM (scanner + emitter)"
license = "GPL-3.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sbpf2rv"
path = "src/main.rs"

[dependencies]
sbpf-core = { path = "../guests-compiled/sbpf-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# The machine's own Poseidon2 sponge (`hash::sponge_hash`), for the ELF guard's digest
# (`shim::view_digest`). Also the parity test's oracle: `SbpfCall` (the SPL Token vectors and their
# two input segments) and `HostRef`, the same fixtures the interpreter's own tests use.
rand_zkvm = { path = "../research" }

# Its own workspace root, like every crate here (guests-compiled/sbpf-core, rand-guest, …): never
# swept into research's or circuits' own cargo test/build.
[workspace]

# Constraint set 11: `rand_zkvm` proves and verifies through the vendored `p3-batch-stark`'s
# `QuotientLayout` (`research/Cargo.toml`'s `[patch]`), and a `[patch]` applies only to the package
# root that declares it — so this root carries the same three, or crates.io's 0.7.0 (which has no
# `QuotientLayout`) is resolved and `rand_zkvm` does not compile. The hiding-RNG lock patch rides
# along as `research/` takes it (`../vendor/PROVENANCE.md`).
[patch.crates-io]
p3-batch-stark = { path = "../vendor/p3-batch-stark" }
p3-fri = { path = "../vendor/p3-fri" }
p3-merkle-tree = { path = "../vendor/p3-merkle-tree" }
